name: Tests lab 8

# Запускать при каждом push и pull request
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачать код репозитория на виртуальную машину
      - name: Получить код
        uses: actions/checkout@v4

      # 2. Установить Python
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Установить библиотеки
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запустить ТОЛЬКО тесты лабораторной №8
      - name: Запустить тесты лабораторной 8
        run: pytest lab_8_test.py -v